<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Goal Form</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/goals}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${pageTitle}">Goal</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/goals/save}" method="post" th:object="${goal}">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Goal Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Emergency Fund, Vacation, New Car..."/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}"
                                      rows="2" placeholder="Optional description..."></textarea>
                        </div>

                        <!-- Target Amount -->
                        <div class="mb-3">
                            <label for="targetAmount" class="form-label fw-semibold">Target Amount (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       id="targetAmount" th:field="*{targetAmount}"
                                       th:classappend="${#fields.hasErrors('targetAmount') ? 'is-invalid' : ''}"
                                       placeholder="0.00"/>
                                <div class="invalid-feedback" th:errors="*{targetAmount}"></div>
                            </div>
                        </div>

                        <!-- Current Amount -->
                        <div class="mb-3">
                            <label for="currentAmount" class="form-label fw-semibold">Amount Already Saved (€)</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="currentAmount" th:field="*{currentAmount}"
                                       placeholder="0.00"/>
                            </div>
                        </div>

                        <!-- Target Date -->
                        <div class="mb-3">
                            <label for="targetDate" class="form-label fw-semibold">Target Date</label>
                            <input type="date" class="form-control" id="targetDate" th:field="*{targetDate}"/>
                        </div>

                        <!-- Status -->
                        <div class="mb-4">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}"></option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Save Goal
                            </button>
                            <a th:href="@{/goals}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</layout:fragment>
</body>
</html>
