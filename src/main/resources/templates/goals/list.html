<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Goals - FinanceBoard', ~{::content}, 'goals')}">
<body>
<th:block th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-trophy me-2 text-primary"></i>Savings Goals</h2>
        <a th:href="@{/goals/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Goal
        </a>
    </div>

    <div th:if="${#lists.isEmpty(goals)}" class="text-center text-muted py-5">
        <i class="bi bi-trophy fs-1 d-block mb-2 opacity-50"></i>
        No goals yet. <a th:href="@{/goals/new}">Create your first goal</a>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="goal : ${goals}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${goal.name}"></h5>
                        <div class="d-flex gap-1">
                            <span th:switch="${goal.status.name()}">
                                <span th:case="'ACTIVE'" class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
                                <span th:case="'COMPLETED'" class="badge bg-primary-subtle text-primary border border-primary-subtle">Completed</span>
                                <span th:case="'PAUSED'" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">Paused</span>
                            </span>
                        </div>
                    </div>

                    <p th:if="${goal.description}" class="text-muted small mb-3" th:text="${goal.description}"></p>

                    <div class="mb-2">
                        <div class="d-flex justify-content-between small mb-1">
                            <span class="text-muted">Progress</span>
                            <span class="fw-semibold" th:text="${goal.progressPercentInt} + '%'"></span>
                        </div>
                        <div class="progress" style="height:10px">
                        <div th:class="${goal.progressBarClass}"
                                 th:style="'width:' + ${goal.progressPercentInt} + '%'"
                                 role="progressbar"></div>
                        </div>
                    </div>

                    <div class="row g-2 text-center mt-2">
                        <div class="col-6">
                            <div class="text-muted small">Saved</div>
                            <div class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(goal.currentAmount, 1, 2)}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted small">Target</div>
                            <div class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(goal.targetAmount, 1, 2)}"></div>
                        </div>
                    </div>

                    <div th:if="${goal.targetDate}" class="text-muted small mt-2">
                        <i class="bi bi-calendar me-1"></i>
                        Target: <span th:text="${#temporals.format(goal.targetDate, 'dd MMM yyyy')}"></span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 pt-0">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/goals/{id}/edit(id=${goal.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="post"
                              onsubmit="return confirm('Delete this goal?')">
                            <button class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
