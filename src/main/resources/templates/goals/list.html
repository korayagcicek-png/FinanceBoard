<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Goals</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-trophy me-2 text-primary"></i>Savings Goals</h2>
        <a th:href="@{/goals/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Goal
        </a>
    </div>

    <div th:if="${goals.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-trophy fs-1 d-block mb-2"></i>
        No goals defined yet.
        <div class="mt-2"><a th:href="@{/goals/new}">Create your first goal</a></div>
    </div>

    <div class="row g-3" th:unless="${goals.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="goal : ${goals}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h6 class="mb-1 fw-semibold" th:text="${goal.name}">Goal Name</h6>
                            <span class="badge"
                                  th:classappend="${goal.status.name() == 'ACTIVE' ? 'bg-primary' :
                                                  (goal.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-secondary')}"
                                  th:text="${goal.status.name()}">
                            </span>
                        </div>
                        <div class="d-flex gap-1">
                            <a th:href="@{/goals/{id}/edit(id=${goal.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this goal?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <p th:if="${goal.description}" class="small text-muted mb-3"
                       th:text="${goal.description}"></p>

                    <!-- Progress -->
                    <div class="d-flex justify-content-between small mb-1">
                        <span class="text-muted">Progress</span>
                        <span class="fw-semibold" th:text="${goal.progressPercent} + '%'">0%</span>
                    </div>
                    <div class="progress mb-2" style="height: 10px;">
                        <div class="progress-bar"
                             th:classappend="${goal.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-primary'}"
                             th:style="'width: ' + ${goal.progressPercent} + '%'">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between small mb-2">
                        <span class="text-muted">Saved: <span class="text-dark fw-semibold"
                              th:text="'€' + ${#numbers.formatDecimal(goal.currentAmount, 1, 2)}"></span></span>
                        <span class="text-muted">Target: <span class="text-dark fw-semibold"
                              th:text="'€' + ${#numbers.formatDecimal(goal.targetAmount, 1, 2)}"></span></span>
                    </div>

                    <div th:if="${goal.targetDate}" class="small text-muted mb-3">
                        <i class="bi bi-calendar3 me-1"></i>Target:
                        <span th:text="${#temporals.format(goal.targetDate, 'dd MMM yyyy')}"></span>
                    </div>

                    <!-- Contribution form (only for active goals) -->
                    <div th:if="${goal.status.name() == 'ACTIVE'}" class="mt-auto">
                        <form th:action="@{/goals/{id}/contribute(id=${goal.id})}" method="post"
                              class="d-flex gap-2">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0.01" name="amount"
                                       class="form-control" placeholder="Amount"/>
                            </div>
                            <button type="submit" class="btn btn-sm btn-success flex-shrink-0">
                                <i class="bi bi-plus-circle me-1"></i>Add
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</layout:fragment>
</body>
</html>
