<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Transactions - FinanceBoard', ~{::content}, 'transactions')}">
<body>
<th:block th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-arrow-left-right me-2 text-primary"></i>Transactions</h2>
        <a th:href="@{/transactions/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Transaction
        </a>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-3">
            <form class="row g-2 align-items-end" method="get" th:action="@{/transactions}">
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1">Month</label>
                    <select name="month" class="form-select form-select-sm">
                        <option value="">All months</option>
                        <option th:each="m : ${#numbers.sequence(1,12)}"
                                th:value="${m}"
                                th:text="${#temporals.format(#temporals.create(selectedYear, m, 1), 'MMMM')}"
                                th:selected="${m == selectedMonth}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1">Year</label>
                    <select name="year" class="form-select form-select-sm">
                        <option th:each="yr : ${#numbers.sequence(currentYear - 3, currentYear)}"
                                th:value="${yr}" th:text="${yr}"
                                th:selected="${yr == selectedYear}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label small text-muted mb-1">Category</label>
                    <select name="categoryId" class="form-select form-select-sm">
                        <option value="">All categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id == selectedCategoryId}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-primary" type="submit">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                    <a th:href="@{/transactions}" class="btn btn-sm btn-outline-secondary ms-1">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Transaction Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(transactions)}" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                No transactions found. <a th:href="@{/transactions/new}">Add one</a>
            </div>
            <div th:unless="${#lists.isEmpty(transactions)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th class="text-end">Amount</th>
                            <th class="text-center" style="width:100px">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tx : ${transactions}">
                            <td class="text-nowrap">
                                <span th:text="${#temporals.format(tx.date, 'dd MMM yyyy')}"></span>
                            </td>
                            <td>
                                <span th:text="${tx.description ?: '-'}"></span>
                                <div th:if="${tx.notes}" class="text-muted small" th:text="${tx.notes}"></div>
                            </td>
                            <td>
                                <span th:if="${tx.category != null}"
                                      class="badge rounded-pill"
                                      th:style="'background-color:' + ${tx.category.color}"
                                      th:text="${tx.category.icon != null ? tx.category.icon + ' ' : ''} + ${tx.category.name}"></span>
                                <span th:if="${tx.category == null}" class="text-muted small">Uncategorized</span>
                            </td>
                            <td>
                                <span th:if="${tx.type.name() == 'INCOME'}" class="badge bg-success-subtle text-success border border-success-subtle">
                                    <i class="bi bi-arrow-down me-1"></i>Income
                                </span>
                                <span th:if="${tx.type.name() == 'EXPENSE'}" class="badge bg-danger-subtle text-danger border border-danger-subtle">
                                    <i class="bi bi-arrow-up me-1"></i>Expense
                                </span>
                            </td>
                            <td class="text-end fw-semibold"
                                th:class="${tx.type.name() == 'INCOME'} ? 'text-end fw-semibold text-success' : 'text-end fw-semibold text-danger'">
                                <span th:text="${tx.type.name() == 'INCOME' ? '+' : '-'}"></span>$<span th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}"></span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/transactions/{id}/edit(id=${tx.id})}"
                                   class="btn btn-sm btn-outline-secondary me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/transactions/{id}/delete(id=${tx.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this transaction?')">
                                    <button class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
