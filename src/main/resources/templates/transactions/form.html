<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${editMode != null and editMode ? 'Edit Transaction' : 'New Transaction'} + ' - FinanceBoard', ~{::content}, 'transactions')}">
<body>
<th:block th:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 bg-transparent">
                    <h4 class="mb-0">
                        <i class="bi bi-arrow-left-right me-2 text-primary"></i>
                        <span th:text="${editMode != null and editMode ? 'Edit Transaction' : 'Add Transaction'}"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${editMode != null and editMode ? '/transactions/' + form.id + '/edit' : '/transactions'}"
                          th:object="${form}" method="post" novalidate>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Amount <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" th:field="*{amount}"
                                       step="0.01" min="0.01" placeholder="0.00"
                                       th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
                                <div th:if="${#fields.hasErrors('amount')}" class="invalid-feedback"
                                     th:errors="*{amount}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{type}"
                                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                <option value="INCOME">Income</option>
                                <option value="EXPENSE">Expense</option>
                            </select>
                            <div th:if="${#fields.hasErrors('type')}" class="invalid-feedback" th:errors="*{type}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{date}"
                                   th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'">
                            <div th:if="${#fields.hasErrors('date')}" class="invalid-feedback" th:errors="*{date}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <input type="text" class="form-control" th:field="*{description}"
                                   placeholder="What was this for?" maxlength="255">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" th:field="*{categoryId}">
                                <option value="">No category</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.icon != null ? cat.icon + ' ' : ''} + ${cat.name}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Notes</label>
                            <textarea class="form-control" th:field="*{notes}" rows="2"
                                      placeholder="Optional notes..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/transactions}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${editMode != null and editMode ? 'Update Transaction' : 'Add Transaction'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
