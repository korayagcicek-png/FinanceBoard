<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Transaction Form</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/transactions}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${pageTitle}">Transaction</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/transactions/save}" method="post" th:object="${transaction}">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Type -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="type" id="typeExpense"
                                           value="EXPENSE" th:checked="*{type == null or type.name() == 'EXPENSE'}"/>
                                    <label class="form-check-label text-danger fw-semibold" for="typeExpense">
                                        <i class="bi bi-arrow-up-circle-fill me-1"></i>Expense
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="type" id="typeIncome"
                                           value="INCOME" th:checked="*{type != null and type.name() == 'INCOME'}"/>
                                    <label class="form-check-label text-success fw-semibold" for="typeIncome">
                                        <i class="bi bi-arrow-down-circle-fill me-1"></i>Income
                                    </label>
                                </div>
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('type')}"
                                 th:errors="*{type}"></div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="description" th:field="*{description}"
                                   th:classappend="${#fields.hasErrors('description') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Monthly rent, Grocery shopping..."/>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <!-- Amount -->
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold">Amount (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="amount"
                                       th:field="*{amount}"
                                       th:classappend="${#fields.hasErrors('amount') ? 'is-invalid' : ''}"
                                       placeholder="0.00"/>
                                <div class="invalid-feedback" th:errors="*{amount}"></div>
                            </div>
                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label for="date" class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date" th:field="*{date}"
                                   th:classappend="${#fields.hasErrors('date') ? 'is-invalid' : ''}"/>
                            <div class="invalid-feedback" th:errors="*{date}"></div>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label for="categoryId" class="form-label fw-semibold">Category</label>
                            <select class="form-select" id="categoryId" name="category.id">
                                <option value="">— None —</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${transaction.category != null and transaction.category.id == cat.id}">
                                </option>
                            </select>
                        </div>

                        <!-- Notes -->
                        <div class="mb-4">
                            <label for="notes" class="form-label fw-semibold">Notes</label>
                            <textarea class="form-control" id="notes" th:field="*{notes}"
                                      rows="2" placeholder="Optional notes..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Save Transaction
                            </button>
                            <a th:href="@{/transactions}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</layout:fragment>
</body>
</html>
