<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Project Form</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/projects}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${pageTitle}">Project</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/projects/save}" method="post" th:object="${project}">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Project Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Home Renovation, Car Purchase..."/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}"
                                      rows="3" placeholder="Optional description..."></textarea>
                        </div>

                        <!-- Estimated Cost -->
                        <div class="mb-3">
                            <label for="estimatedCost" class="form-label fw-semibold">Estimated Cost (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       id="estimatedCost" th:field="*{estimatedCost}"
                                       th:classappend="${#fields.hasErrors('estimatedCost') ? 'is-invalid' : ''}"
                                       placeholder="0.00"/>
                                <div class="invalid-feedback" th:errors="*{estimatedCost}"></div>
                            </div>
                        </div>

                        <!-- Actual Cost -->
                        <div class="mb-3">
                            <label for="actualCost" class="form-label fw-semibold">Actual Cost Spent So Far (€)</label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="actualCost" th:field="*{actualCost}"
                                       placeholder="0.00"/>
                            </div>
                        </div>

                        <!-- Deadline -->
                        <div class="mb-3">
                            <label for="deadline" class="form-label fw-semibold">Deadline</label>
                            <input type="date" class="form-control" id="deadline" th:field="*{deadline}"/>
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}"
                                        th:text="${s.name().replace('_', ' ')}"></option>
                            </select>
                        </div>

                        <!-- Progress -->
                        <div class="mb-4">
                            <label for="progressPercent" class="form-label fw-semibold">
                                Progress: <span id="progressLabel">0</span>%
                            </label>
                            <input type="range" class="form-range" id="progressPercent"
                                   th:field="*{progressPercent}" min="0" max="100"
                                   oninput="document.getElementById('progressLabel').textContent = this.value"/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Save Project
                            </button>
                            <a th:href="@{/projects}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</layout:fragment>

<layout:fragment name="scripts">
<script>
    // Initialize progress label on page load
    const slider = document.getElementById('progressPercent');
    const label = document.getElementById('progressLabel');
    if (slider && label) {
        label.textContent = slider.value;
    }
</script>
</layout:fragment>
</body>
</html>
