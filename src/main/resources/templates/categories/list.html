<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Categories</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-tags me-2 text-primary"></i>Categories</h2>
        <a th:href="@{/categories/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Category
        </a>
    </div>

    <div th:if="${categories.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-tags fs-1 d-block mb-2"></i>
        No categories defined yet.
        <div class="mt-2"><a th:href="@{/categories/new}">Create your first category</a></div>
    </div>

    <div class="card border-0 shadow-sm" th:unless="${categories.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Color</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Icon</th>
                        <th class="text-end pe-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="ps-3">
                            <div class="rounded-circle d-inline-block"
                                 th:style="'background-color: ' + ${cat.color != null ? cat.color : '#6c757d'} + '; width:24px; height:24px;'">
                            </div>
                        </td>
                        <td class="fw-semibold" th:text="${cat.name}">Name</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cat.type.name() == 'INCOME' ? 'bg-success' :
                                                  (cat.type.name() == 'EXPENSE' ? 'bg-danger' : 'bg-primary')}"
                                  th:text="${cat.type.name()}">
                            </span>
                        </td>
                        <td>
                            <i th:if="${cat.icon}" class="bi"
                               th:classappend="${cat.icon}" th:title="${cat.icon}"></i>
                            <span th:unless="${cat.icon}" class="text-muted">—</span>
                        </td>
                        <td class="text-end pe-3">
                            <a th:href="@{/categories/{id}/edit(id=${cat.id})}"
                               class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Delete this category? This may affect existing transactions.')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</layout:fragment>
</body>
</html>
