<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${pageTitle}">Budget Form</title>
</head>
<body>
<layout:fragment name="content">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/budgets}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${pageTitle}">Budget</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/budgets/save}" method="post" th:object="${budget}">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Category -->
                        <div class="mb-3">
                            <label for="categoryId" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="categoryId" name="category.id"
                                    th:classappend="${#fields.hasErrors('category') ? 'is-invalid' : ''}">
                                <option value="">— Select Category —</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${budget.category != null and budget.category.id == cat.id}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{category}"></div>
                        </div>

                        <!-- Limit Amount -->
                        <div class="mb-3">
                            <label for="limitAmount" class="form-label fw-semibold">Monthly Limit (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="limitAmount"
                                       th:field="*{limitAmount}"
                                       th:classappend="${#fields.hasErrors('limitAmount') ? 'is-invalid' : ''}"
                                       placeholder="0.00"/>
                                <div class="invalid-feedback" th:errors="*{limitAmount}"></div>
                            </div>
                        </div>

                        <!-- Month -->
                        <div class="mb-3">
                            <label for="month" class="form-label fw-semibold">Month <span class="text-danger">*</span></label>
                            <select class="form-select" id="month" th:field="*{month}">
                                <option th:each="m : ${#numbers.sequence(1,12)}"
                                        th:value="${m}"
                                        th:text="${#temporals.format(#temporals.createDate(2024, m, 1), 'MMMM')}">
                                </option>
                            </select>
                        </div>

                        <!-- Year -->
                        <div class="mb-4">
                            <label for="year" class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="year" th:field="*{year}"
                                   min="2000" max="2100"
                                   th:classappend="${#fields.hasErrors('year') ? 'is-invalid' : ''}"/>
                            <div class="invalid-feedback" th:errors="*{year}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Save Budget
                            </button>
                            <a th:href="@{/budgets}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</layout:fragment>
</body>
</html>
