<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${editMode != null and editMode ? 'Edit Budget' : 'New Budget'} + ' - FinanceBoard', ~{::content}, 'budgets')}">
<body>
<th:block th:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 bg-transparent">
                    <h4 class="mb-0">
                        <i class="bi bi-wallet2 me-2 text-primary"></i>
                        <span th:text="${editMode != null and editMode ? 'Edit Budget' : 'Set Budget'}"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${editMode != null and editMode ? '/budgets/' + form.id + '/edit' : '/budgets'}"
                          th:object="${form}" method="post" novalidate>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" th:field="*{categoryId}">
                                <option value="">Overall (all expenses)</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.icon != null ? cat.icon + ' ' : ''} + ${cat.name}"></option>
                            </select>
                            <div class="form-text">Leave empty to set an overall monthly limit.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Month <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{month}"
                                        th:classappend="${#fields.hasErrors('month')} ? 'is-invalid'">
                                    <option value="1">January</option>
                                    <option value="2">February</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="6">June</option>
                                    <option value="7">July</option>
                                    <option value="8">August</option>
                                    <option value="9">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select>
                                <div th:if="${#fields.hasErrors('month')}" class="invalid-feedback" th:errors="*{month}"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{year}"
                                       min="2000" max="2100"
                                       th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'">
                                <div th:if="${#fields.hasErrors('year')}" class="invalid-feedback" th:errors="*{year}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Budget Limit <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" th:field="*{limitAmount}"
                                       step="0.01" min="0.01" placeholder="0.00"
                                       th:classappend="${#fields.hasErrors('limitAmount')} ? 'is-invalid'">
                                <div th:if="${#fields.hasErrors('limitAmount')}" class="invalid-feedback"
                                     th:errors="*{limitAmount}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/budgets}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${editMode != null and editMode ? 'Update Budget' : 'Save Budget'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
