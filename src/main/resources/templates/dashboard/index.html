<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Dashboard - FinanceBoard', ~{::content}, 'dashboard')}">
<body>
<th:block th:fragment="content">

    <!-- Header Row -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard</h2>
        <form class="d-flex gap-2 align-items-center" method="get" th:action="@{/dashboard}">
            <select name="month" class="form-select form-select-sm" style="width:130px">
                <option th:each="m : ${#numbers.sequence(1,12)}"
                        th:value="${m}"
                        th:text="${#temporals.format(#temporals.create(data.year, m, 1), 'MMMM')}"
                        th:selected="${m == data.month}"></option>
            </select>
            <select name="year" class="form-select form-select-sm" style="width:90px">
                <option th:each="yr : ${#numbers.sequence(currentYear - 3, currentYear)}"
                        th:value="${yr}" th:text="${yr}"
                        th:selected="${yr == data.year}"></option>
            </select>
            <button class="btn btn-sm btn-outline-primary" type="submit">
                <i class="bi bi-funnel me-1"></i>Filter
            </button>
        </form>
    </div>

    <!-- KPI Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3 me-3">
                        <i class="bi bi-arrow-down-circle text-success fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Total Income</div>
                        <div class="fw-bold fs-5 text-success" th:text="'$' + ${#numbers.formatDecimal(data.totalIncome, 1, 2)}">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-danger bg-opacity-10 p-3 me-3">
                        <i class="bi bi-arrow-up-circle text-danger fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Total Expenses</div>
                        <div class="fw-bold fs-5 text-danger" th:text="'$' + ${#numbers.formatDecimal(data.totalExpense, 1, 2)}">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div th:class="${data.netPositive}
                        ? 'rounded-circle bg-primary bg-opacity-10 p-3 me-3'
                        : 'rounded-circle bg-warning bg-opacity-10 p-3 me-3'">
                        <i th:class="${data.netPositive}
                            ? 'bi bi-graph-up text-primary fs-4'
                            : 'bi bi-graph-down text-warning fs-4'"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Net</div>
                        <div th:class="${data.netPositive}
                            ? 'fw-bold fs-5 text-primary' : 'fw-bold fs-5 text-warning'"
                             th:text="'$' + ${#numbers.formatDecimal(data.netAmount, 1, 2)}">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-3 mb-4">
        <!-- Expense by Category (Pie) -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0 pb-0">
                    <h6 class="mb-0"><i class="bi bi-pie-chart me-2 text-primary"></i>Spending by Category</h6>
                </div>
                <div class="card-body d-flex justify-content-center">
                    <div style="position:relative; height:260px; width:100%">
                        <canvas id="categoryPieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Monthly Trend (Bar) -->
        <div class="col-md-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0 pb-0">
                    <h6 class="mb-0"><i class="bi bi-bar-chart me-2 text-primary"></i>Monthly Trend (6 months)</h6>
                </div>
                <div class="card-body">
                    <div style="position:relative; height:260px">
                        <canvas id="trendBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Budgets & Goals Row -->
    <div class="row g-3">
        <!-- Budget Summary -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-wallet2 me-2 text-primary"></i>Budget Status</h6>
                    <a th:href="@{/budgets}" class="btn btn-sm btn-outline-secondary">View All</a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(data.budgetStatuses)}" class="text-muted text-center py-3">
                        No budgets set for this month.
                        <a th:href="@{/budgets/new}">Add one</a>
                    </div>
                    <div th:each="bs : ${data.budgetStatuses}" class="mb-3">
                        <div class="d-flex justify-content-between small mb-1">
                            <span th:text="${bs.categoryName}" class="fw-semibold"></span>
                            <span th:class="${bs.overBudget} ? 'text-danger fw-bold' : 'text-muted'">
                                $<span th:text="${#numbers.formatDecimal(bs.spentAmount, 1, 2)}"></span>
                                / $<span th:text="${#numbers.formatDecimal(bs.limitAmount, 1, 2)}"></span>
                            </span>
                        </div>
                        <div class="progress" style="height:8px">
                            <div th:class="${bs.progressBarClass}"
                                 th:style="'width:' + ${bs.usagePercentCapped} + '%'"
                                 role="progressbar"></div>
                        </div>
                        <div th:if="${bs.overBudget}" class="text-danger small mt-1">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            Over budget by $<span th:text="${#numbers.formatDecimal(bs.spentAmount.subtract(bs.limitAmount).abs(), 1, 2)}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Goals Summary -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-trophy me-2 text-primary"></i>Savings Goals</h6>
                    <a th:href="@{/goals}" class="btn btn-sm btn-outline-secondary">View All</a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(data.activeGoals)}" class="text-muted text-center py-3">
                        No active goals. <a th:href="@{/goals/new}">Create one</a>
                    </div>
                    <div th:each="goal : ${data.activeGoals}" class="mb-3">
                        <div class="d-flex justify-content-between small mb-1">
                            <span th:text="${goal.name}" class="fw-semibold"></span>
                            <span class="text-muted">
                                <span th:text="${goal.progressPercentInt}"></span>%
                            </span>
                        </div>
                        <div class="progress" style="height:8px">
                            <div class="progress-bar bg-primary"
                                 th:class="${goal.progressBarClass}"
                                 th:style="'width:' + ${goal.progressPercentInt} + '%'"
                                 role="progressbar"></div>
                        </div>
                        <div class="d-flex justify-content-between small text-muted mt-1">
                            <span>$<span th:text="${#numbers.formatDecimal(goal.currentAmount, 1, 2)}"></span></span>
                            <span>$<span th:text="${#numbers.formatDecimal(goal.targetAmount, 1, 2)}"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js initialization -->
    <script th:inline="javascript">
        (function() {
            // Pie Chart: Expenses by Category
            const pieLabels = [];
            const pieData = [];
            const pieColors = [];
            /*[# th:each="entry : ${data.expensesByCategory}"]*/
            pieLabels.push(/*[[${entry.key}]]*/ 'Category');
            pieData.push(/*[[${entry.value}]]*/ 0);
            pieColors.push(/*[[${data.categoryColors.get(entry.key) ?: '#6c757d'}]]*/ '#6c757d');
            /*[/]*/

            if (pieData.length > 0 && pieData.some(v => v > 0)) {
                new Chart(document.getElementById('categoryPieChart'), {
                    type: 'doughnut',
                    data: {
                        labels: pieLabels,
                        datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 2 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { boxWidth: 12, font: { size: 12 } } }
                        }
                    }
                });
            } else {
                const el = document.getElementById('categoryPieChart');
                if (el) el.parentElement.innerHTML = '<p class="text-muted text-center pt-5">No expense data for this month.</p>';
            }

            // Bar Chart: Monthly Trend
            const trendLabels = /*[[${data.trendLabels}]]*/ [];
            const trendIncome  = /*[[${data.trendIncome}]]*/ [];
            const trendExpense = /*[[${data.trendExpense}]]*/ [];

            new Chart(document.getElementById('trendBarChart'), {
                type: 'bar',
                data: {
                    labels: trendLabels,
                    datasets: [
                        { label: 'Income',   data: trendIncome,  backgroundColor: 'rgba(40,167,69,0.75)',  borderRadius: 4 },
                        { label: 'Expenses', data: trendExpense, backgroundColor: 'rgba(220,53,69,0.75)', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: v => '$' + Number(v).toLocaleString() } }
                    }
                }
            });
        })();
    </script>

</th:block>
</body>
</html>
