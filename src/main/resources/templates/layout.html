<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE - FinanceBoard">FinanceBoard</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bar-chart-fill me-2"></i>FinanceBoard
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions}" th:classappend="${#httpServletRequest.requestURI.startsWith('/transactions') ? 'active' : ''}">
                        <i class="bi bi-arrow-left-right me-1"></i>Transactions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/budgets}" th:classappend="${#httpServletRequest.requestURI.startsWith('/budgets') ? 'active' : ''}">
                        <i class="bi bi-wallet2 me-1"></i>Budgets
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/goals}" th:classappend="${#httpServletRequest.requestURI.startsWith('/goals') ? 'active' : ''}">
                        <i class="bi bi-trophy me-1"></i>Goals
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/projects}" th:classappend="${#httpServletRequest.requestURI.startsWith('/projects') ? 'active' : ''}">
                        <i class="bi bi-kanban me-1"></i>Projects
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categories}" th:classappend="${#httpServletRequest.requestURI.startsWith('/categories') ? 'active' : ''}">
                        <i class="bi bi-tags me-1"></i>Categories
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Flash messages -->
<div class="container-fluid px-4 mt-3" th:if="${successMessage}">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div class="container-fluid px-4 mt-3" th:if="${errorMessage}">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Main content -->
<main class="container-fluid px-4 py-3 flex-grow-1">
    <layout:fragment name="content">
        <!-- Page content goes here -->
    </layout:fragment>
</main>

<!-- Footer -->
<footer class="bg-light border-top py-3 mt-auto">
    <div class="container-fluid px-4 text-center text-muted small">
        <i class="bi bi-lock-fill me-1"></i>FinanceBoard — Local Personal Finance Tracker &mdash; Your data stays on your machine.
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Custom scripts -->
<script th:src="@{/js/app.js}"></script>

<layout:fragment name="scripts">
    <!-- Page-specific scripts go here -->
</layout:fragment>
</body>
</html>
