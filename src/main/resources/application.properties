# FinanceBoard - Local-first personal finance tracker
spring.application.name=FinanceBoard

# H2 In-memory database (zero-config local startup)
spring.datasource.url=jdbc:h2:file:./data/financeboard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Console (useful for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Server
server.port=8080

# Logging
logging.level.com.financeboard=INFO
logging.level.org.springframework.modulith=INFO
